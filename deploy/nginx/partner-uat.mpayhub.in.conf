# partner-uat.mpayhub.in — PM2 backend :8000 + frontend :3002 (internal)
# nginx :80 / :443 / :3001 (Cloudflare Tunnel target) → proxies to PM2

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 3001;
    listen [::]:3001;
    server_name partner-uat.mpayhub.in;

    ssl_certificate     /etc/nginx/ssl/partner-uat.mpayhub.in.crt;
    ssl_certificate_key /etc/nginx/ssl/partner-uat.mpayhub.in.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location /backstatic/ {
        alias /root/Mpayhub-UAT/MpayHub/backend/staticfiles/;
    }

    location /media/ {
        alias /root/Mpayhub-UAT/MpayHub/backend/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
