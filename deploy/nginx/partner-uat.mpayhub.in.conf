# partner-uat.mpayhub.in — same routing as production (partner.mpayhub.in).
# Apps bind localhost only; UI uses same-origin /api (no mixed content).
# Extra listen :3001 for Cloudflare Tunnel (infra-only difference from prod).
#
#   /        → 127.0.0.1:3002  (React SPA, including /admin/* and /static/*)
#   /api/    → 127.0.0.1:8002  (Django/Gunicorn)
#   /media/  → 127.0.0.1:8002  (default_storage: local or S3 via USE_S3)
#   /django-admin/ → Django Admin (not React)
#
# Rollback to disk alias (only if USE_S3=False and local media still present):
#   location /media/ { alias /root/Mpayhub-UAT/MpayHub/backend/media/; }

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 3001;
    listen [::]:3001;
    server_name partner-uat.mpayhub.in;

    ssl_certificate     /etc/nginx/ssl/partner-uat.mpayhub.in.crt;
    ssl_certificate_key /etc/nginx/ssl/partner-uat.mpayhub.in.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location /django-admin/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location /backstatic/ {
        alias /root/Mpayhub-UAT/MpayHub/backend/staticfiles/;
    }

    # Never map /static/ to Django — CRA owns /static/js and /static/css via the SPA.

    # Media via Django default_storage (local disk or S3). Do not alias disk when USE_S3=True.
    # Phase 1: nginx proxy_cache reduces repeat S3/Gunicorn hits. Rollback: proxy_cache off;
    location /media/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;

        proxy_cache mpayhub_media;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $http_pragma $http_authorization;
        proxy_no_cache $http_pragma $http_authorization;
        add_header X-Media-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
