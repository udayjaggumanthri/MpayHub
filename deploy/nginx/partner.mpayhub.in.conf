# partner.mpayhub.in — sole public entry (TLS + HTTP).
# Apps bind localhost only; UI uses same-origin /api (no mixed content).
# TLS: Let's Encrypt for the domain; self-signed kept only for direct-IP HTTPS.

# --- HTTP: ACME + force HTTPS for domain ---
server {
    listen 80;
    listen [::]:80;
    server_name partner.mpayhub.in www.partner.mpayhub.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://partner.mpayhub.in$request_uri;
    }
}

# --- HTTP: direct IP (no LE cert for bare IP) ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 103.127.146.47 _;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location /backstatic/ {
        alias /root/MpayHub/backend/staticfiles/;
    }

    location /media/ {
        alias /root/MpayHub/backend/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- HTTPS: domain (Let's Encrypt — paths filled after certbot) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name partner.mpayhub.in www.partner.mpayhub.in;

    ssl_certificate     /etc/letsencrypt/live/partner.mpayhub.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partner.mpayhub.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    # HSTS — browsers stay on HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location /backstatic/ {
        alias /root/MpayHub/backend/staticfiles/;
    }

    location /media/ {
        alias /root/MpayHub/backend/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- HTTPS: direct IP (self-signed; browsers will warn — prefer domain) ---
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 103.127.146.47;

    ssl_certificate     /etc/nginx/ssl/partner.mpayhub.in.crt;
    ssl_certificate_key /etc/nginx/ssl/partner.mpayhub.in.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location /backstatic/ {
        alias /root/MpayHub/backend/staticfiles/;
    }

    location /media/ {
        alias /root/MpayHub/backend/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
