# Proxy cache for /media/ (Phase 1). Shared by UAT and prod site configs.
# Rollback: remove proxy_cache lines from location /media/ or set proxy_cache off.
proxy_cache_path /var/cache/nginx/mpayhub_media levels=1:2 keys_zone=mpayhub_media:100m
                 max_size=1g inactive=24h use_temp_path=off;
