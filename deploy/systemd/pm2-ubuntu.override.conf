# PM2 6 + systemd Type=forking breaks without pm2.pid. Use oneshot resurrect instead.
# Install: sudo mkdir -p /etc/systemd/system/pm2-ubuntu.service.d
#          sudo cp deploy/systemd/pm2-ubuntu.override.conf /etc/systemd/system/pm2-ubuntu.service.d/override.conf
#          sudo systemctl daemon-reload && sudo systemctl restart pm2-ubuntu

[Service]
Type=oneshot
RemainAfterExit=yes
PIDFile=
ExecStart=/usr/local/bin/pm2 resurrect
ExecStop=/usr/local/bin/pm2 kill
Environment=PATH=/usr/local/bin:/usr/bin:/bin
Environment=PM2_HOME=/home/ubuntu/.pm2
